<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Educational Video Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Educational Video Summarizer</h1>
    <form id="summaryForm" class="bg-white p-6 rounded shadow-md w-full max-w-lg space-y-4">
        <div>
            <label for="videoUrl" class="block text-gray-700 font-semibold mb-1">Video URL</label>
            <input type="url" id="videoUrl" name="videoUrl" placeholder="Enter video URL" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
            <label for="videoFile" class="block text-gray-700 font-semibold mb-1">Or Upload Video File</label>
            <input type="file" id="videoFile" name="videoFile" accept="video/*" class="w-full" />
        </div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Get Summary</button>
    </form>
    <div id="result" class="mt-6 max-w-lg w-full bg-white p-4 rounded shadow-md text-gray-800 hidden"></div>

    <script>
        const form = document.getElementById('summaryForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultDiv.classList.add('hidden');
            resultDiv.textContent = '';

            const videoUrl = document.getElementById('videoUrl').value;
            const videoFile = document.getElementById('videoFile').files[0];

            if (!videoUrl && !videoFile) {
                alert('Please provide a video URL or upload a video file.');
                return;
            }

            const formData = new FormData();
            if (videoUrl) {
                formData.append('video_url', videoUrl);
            }
            if (videoFile) {
                formData.append('file', videoFile);
            }

            try {
                const response = await fetch('http://localhost:8000/summarize', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();
                if (data.error) {
                    resultDiv.textContent = 'Error: ' + data.error;
                } else {
                    resultDiv.textContent = data.summary;
                }
                resultDiv.classList.remove('hidden');
            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
